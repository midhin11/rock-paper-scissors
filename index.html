<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="header">
            <h1>Defy the Devine</h1>
            <p class="tag">Can a mortal outsmart the divine will?</p>
        </div>
        <div class="game">
            <p class="pick">The heavens await your move.</p>
            <div class="buttons">
                <button id="rock"><img src="images/rock.svg" alt="rock"></button>
                <button id="paper"><img src="images/paper.png" alt="paper"></button>
                <button id="scissors"><img src="images/scissor.svg" alt="scissors"></button>
            </div>
            <div class="comment"></div>
            <div class="results"></div>
            <div class="score"></div>
            <!-- <button class="newGameBtn">test test</button> -->
        </div>
        <div class="footer">DON'T LOSE YOUR SMILE! © 2025 Midhin Lal | Built with HTML, CSS, and JavaScript</div>
        <script src="javascript.js"></script>
    </body>
</html>
